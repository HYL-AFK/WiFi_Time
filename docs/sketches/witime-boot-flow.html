  <!-- 文本：主链 -->
  <text x="630" y="148" font-size="16" text-anchor="middle">上电</text>

  <text x="442" y="212" font-size="13" font-weight="bold">① GPIO10 立即拉低</text>
  <text x="442" y="232" font-size="10.5" fill="#333333">gpio_set_level(GPIO10, 0) · 数据线先压住</text>
  <text x="442" y="248" font-size="10" fill="#555555">避免点阵上电瞬间随机点亮一串</text>

  <text x="442" y="304" font-size="13" font-weight="bold">② nvs_flash_init()</text>
  <text x="442" y="324" font-size="10.5" fill="#333333">装载 Wi-Fi 凭据 / P 编码表 / 固定坐标 / 音量</text>
  <text x="442" y="340" font-size="10" fill="#555555">命名空间：wifi、app_fault、app_config</text>

  <text x="630" y="429" font-size="12.5" text-anchor="middle">NVS 初始化失败？</text>
  <text x="215" y="415" font-size="12.5" font-weight="bold" text-anchor="middle">nvs_flash_erase() 重试一次</text>
  <text x="215" y="434" font-size="10.5" fill="#333333" text-anchor="middle">NO_FREE_PAGES / NEW_VERSION 触发</text>
  <text x="215" y="450" font-size="10" fill="#555555" text-anchor="middle">仍失败 → 登记 P004，用默认值继续</text>

  <text x="442" y="522" font-size="13" font-weight="bold">③ runtime_event_log_init()</text>
  <text x="442" y="542" font-size="10.5" fill="#333333">写 BOOT 事件：reset_reason / free_heap / 启动次数</text>
  <text x="442" y="558" font-size="10" fill="#555555">环形日志，供事后追重启原因</text>

  <text x="442" y="616" font-size="13" font-weight="bold">④ app_fault_init()</text>
  <text x="442" y="636" font-size="10.5" fill="#333333">读回 8 条 P 编码：active / count / first / last</text>
  <text x="442" y="652" font-size="10" fill="#555555">等级 1 带自愈时限，等级 2 长期挂载只记录</text>

  <text x="442" y="710" font-size="13" font-weight="bold">⑤ app_config_load()</text>
  <text x="442" y="730" font-size="10.5" fill="#333333">SSID / 密码 / AP 密码 / wifi_count / 固定坐标 loc=</text>
  <text x="442" y="746" font-size="10" fill="#555555">无配置 → 后面走 BluFi 配网分支</text>

  <text x="442" y="804" font-size="13" font-weight="bold">⑥ device_name_get() → 三处统一</text>
  <text x="442" y="824" font-size="10.5" fill="#333333">ESPARK_ + STA MAC 后 6 位</text>
  <text x="442" y="840" font-size="10" fill="#555555">BluFi 广播名 / STA hostname / SoftAP SSID 同一个值</text>

  <text x="442" y="898" font-size="13" font-weight="bold">⑦ app_display_init()</text>
  <text x="442" y="918" font-size="10.5" fill="#333333">SPI-DMA 建通道 → 清屏 → 亮度 20%</text>
  <text x="442" y="934" font-size="10" fill="#555555">状态灯（GPIO9）归位到 (15,15)，先清掉上电残影</text>

  <text x="442" y="992" font-size="13" font-weight="bold">⑧ ds3231_init()</text>
  <text x="442" y="1012" font-size="10.5" fill="#333333">I2C 400 kHz · GPIO11=SDA / GPIO12=SCL · 地址 0x68</text>
  <text x="442" y="1028" font-size="10" fill="#555555">初始化失败不影响后续，只做标记</text>

  <text x="630" y="1117" font-size="12.5" text-anchor="middle">I2C 应答？</text>
  <text x="215" y="1103" font-size="12.5" font-weight="bold" text-anchor="middle">登记 P101</text>
  <text x="215" y="1122" font-size="10.5" fill="#333333" text-anchor="middle">时间源退化为「仅 SNTP」</text>
  <text x="215" y="1138" font-size="10" fill="#555555" text-anchor="middle">跳过 ⑨，直接到 ⑪ 显示 --:--</text>

  <text x="442" y="1208" font-size="13" font-weight="bold">⑨ ds3231_read_time()</text>
  <text x="442" y="1228" font-size="10.5" fill="#333333">读 7 字节 BCD → 转 tm → time_snapshot(from_rtc)</text>
  <text x="442" y="1244" font-size="10" fill="#555555">记录秒进位，保证秒点每秒翻转一次</text>

  <text x="630" y="1318" font-size="12.5" text-anchor="middle">RTC 时间有效？</text>
  <text x="630" y="1336" font-size="10" fill="#555555" text-anchor="middle">年份 ≥ 2024 且秒 &lt; 60</text>
  <text x="215" y="1319" font-size="12.5" font-weight="bold" text-anchor="middle">登记 P101</text>
  <text x="215" y="1338" font-size="10.5" fill="#333333" text-anchor="middle">点阵先显示 --:--</text>
  <text x="215" y="1354" font-size="10" fill="#555555" text-anchor="middle">SNTP 成功后立即可见</text>

  <text x="442" y="1424" font-size="13" font-weight="bold">点阵先出 RTC 时间</text>
  <text x="442" y="1444" font-size="10.5" fill="#333333">断网也能走：HH:MM，秒点每秒闪一次</text>
  <text x="442" y="1460" font-size="10" fill="#555555">页面停在时钟主页，天气区先空着</text>

  <text x="442" y="1516" font-size="13" font-weight="bold">⑩ wifi_manager_start()</text>
  <text x="442" y="1536" font-size="10.5" fill="#333333">STA 模式 → 设置 hostname → 开 BluFi 广播</text>
  <text x="442" y="1552" font-size="10" fill="#555555">未配网时同时保留 SoftAP 兜底</text>

  <text x="630" y="1641" font-size="12.5" text-anchor="middle">NVS 已有 Wi-Fi 凭据？</text>
  <text x="1050" y="1626" font-size="12.5" font-weight="bold" text-anchor="middle">BluFi 等待配网（180 s）</text>
  <text x="1050" y="1645" font-size="10.5" fill="#333333" text-anchor="middle">手机写入 SSID / 密码 → 存 NVS</text>
  <text x="1050" y="1662" font-size="10" fill="#555555" text-anchor="middle">成功 → 回 ⑪；超时 → 离线</text>

  <text x="442" y="1732" font-size="13" font-weight="bold">⑪ wifi_connect(ssid)</text>
  <text x="442" y="1752" font-size="10.5" fill="#333333">30 s 超时；失败退避 5 s，重试 3 次</text>
  <text x="442" y="1768" font-size="10" fill="#555555">重试期间状态灯蓝闪，提示正在连</text>

  <text x="630" y="1857" font-size="12.5" text-anchor="middle">拿到 IP？</text>
  <text x="1050" y="1840" font-size="12.5" font-weight="bold" text-anchor="middle">连接失败</text>
  <text x="1050" y="1859" font-size="10.5" fill="#333333" text-anchor="middle">重试 3 次仍未拿到 IP</text>
  <text x="1050" y="1876" font-size="10" fill="#555555" text-anchor="middle">登记 P002，转离线模式</text>

  <text x="442" y="1948" font-size="13" font-weight="bold">⑫ app_time_start()</text>
  <text x="442" y="1968" font-size="10.5" fill="#333333">SNTP 首次同步，10 s 超时</text>
  <text x="442" y="1984" font-size="10" fill="#555555">成功后设置系统时间与本地时区</text>

  <text x="630" y="2073" font-size="12.5" text-anchor="middle">SNTP 同步成功？</text>
  <text x="1050" y="2058" font-size="12.5" font-weight="bold" text-anchor="middle">每分钟重试</text>
  <text x="1050" y="2077" font-size="10.5" fill="#333333" text-anchor="middle">期间时间源保持 RTC</text>
  <text x="1050" y="2093" font-size="10" fill="#555555" text-anchor="middle">不阻塞后续步骤</text>

  <text x="442" y="2164" font-size="13" font-weight="bold">ds3231_set_time() 回写</text>
  <text x="442" y="2184" font-size="10.5" fill="#333333">把 SNTP 时间写进 RTC</text>
  <text x="442" y="2200" font-size="10" fill="#555555">之后每 6 h 再校准一次</text>

  <text x="442" y="2256" font-size="13" font-weight="bold">⑬ location_start()</text>
  <text x="442" y="2276" font-size="10.5" fill="#333333">固定坐标优先（NVS loc=），否则 IP 定位</text>
  <text x="442" y="2292" font-size="10" fill="#555555">双源：ipwho.is → ipapi.co 备用</text>

  <text x="630" y="2381" font-size="12.5" text-anchor="middle">定位在中国境内？</text>
  <text x="215" y="2367" font-size="12.5" font-weight="bold" text-anchor="middle">登记 P103</text>
  <text x="215" y="2386" font-size="10.5" fill="#333333" text-anchor="middle">疑似代理 / VPN 出口</text>
  <text x="215" y="2402" font-size="10" fill="#555555" text-anchor="middle">天气沿用上一次坐标</text>

  <text x="442" y="2472" font-size="13" font-weight="bold">写 location_snapshot</text>
  <text x="442" y="2492" font-size="10.5" fill="#333333">经纬度 → 天气请求参数</text>
  <text x="442" y="2508" font-size="10" fill="#555555">同时刷新点阵定位角标</text>

  <text x="442" y="2564" font-size="13" font-weight="bold">⑭ app_weather_start()</text>
  <text x="442" y="2584" font-size="10.5" fill="#333333">GET open-meteo，10 s 超时，周期 10 min</text>
  <text x="442" y="2600" font-size="10" fill="#555555">语音问天气可立即触发一次刷新</text>

  <text x="630" y="2689" font-size="12.5" text-anchor="middle">天气请求成功？</text>
  <text x="1050" y="2674" font-size="12.5" font-weight="bold" text-anchor="middle">沿用上次快照</text>
  <text x="1050" y="2693" font-size="10.5" fill="#333333" text-anchor="middle">亮天气故障灯（第 2 盏红）</text>
  <text x="1050" y="2710" font-size="10" fill="#555555" text-anchor="middle">每分钟重试，窗口结束后继续</text>

  <text x="442" y="2780" font-size="13" font-weight="bold">解析 → weather_snapshot(network)</text>
  <text x="442" y="2800" font-size="10.5" fill="#333333">温度 / 天气码 / 更新时间</text>
  <text x="442" y="2816" font-size="10" fill="#555555">清故障灯，状态灯双闪两次</text>

  <text x="442" y="2872" font-size="13" font-weight="bold">⑮ status_led_update()</text>
  <text x="442" y="2892" font-size="10.5" fill="#333333">故障红 &gt; 配网蓝闪 &gt; 刷新青 &gt; 正常绿呼吸</text>
  <text x="442" y="2908" font-size="10" fill="#555555">灯位从 (15,15) 起向左排，几类故障几盏灯</text>

  <text x="442" y="2964" font-size="13" font-weight="bold">⑯ display_watchdog() 启动</text>
  <text x="442" y="2984" font-size="10.5" fill="#333333">画面 10 s 无刷新 → 登记 P003</text>
  <text x="442" y="3000" font-size="10" fill="#555555">P003 持续 10 min → 自动重启自愈</text>

  <text x="630" y="3064" font-size="15" font-weight="bold" text-anchor="middle">进入待机 · 主界面</text>
  <text x="630" y="3086" font-size="10.5" fill="#333333" text-anchor="middle">时钟 + 天气 + 状态灯呼吸；事件队列开始分发（语音 / 开关 / 雷达 / 计时）</text>

  <text x="1050" y="2984" font-size="13" font-weight="bold" text-anchor="middle">离线模式</text>
  <text x="1050" y="3003" font-size="10.5" fill="#333333" text-anchor="middle">跳过 ⑫ ~ ⑯ 的联网步骤</text>
  <text x="1050" y="3019" font-size="10" fill="#555555" text-anchor="middle">RTC 走时 + 语音 / 开关 / 雷达照常，每小时后台重连</text>

  <!-- 底部说明 -->
