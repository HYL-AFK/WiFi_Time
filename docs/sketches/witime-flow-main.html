<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WiTime 功能逻辑流程图 · 主流程</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  svg { display: block; }
  text { font-family: "KaiTi", "楷体", "STKaiti", serif; fill: #111111; }
</style>
</head>
<body>
<svg width="1240" height="2020" viewBox="0 0 1240 2020" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ink" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#111111" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="2020" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="60" y="62" font-size="23" font-weight="bold">WiTime 功能逻辑流程图 — 主流程</text>
  <text x="60" y="90" font-size="12.5" fill="#444444">函数级节点 · 判断菱形 · 异常旁路 · 处理完回待机（闭环）；语音 / 开关 / 雷达 / 计时子流程另出图</text>

  <!-- ============ 形状层 ============ -->
  <g filter="url(#ink)" stroke="#111111" stroke-width="1.5" fill="#FFFFFF">
    <!-- 上电 -->
    <rect x="545" y="120" width="150" height="46" rx="23" fill="#F4F4F4"/>

    <!-- N2 ~ N4 -->
    <rect x="470" y="206" width="300" height="62" rx="4"/>
    <rect x="470" y="300" width="300" height="62" rx="4"/>
    <rect x="470" y="394" width="300" height="58" rx="4"/>

    <!-- D1 -->
    <path d="M620,486 L750,540 L620,594 L490,540 Z"/>

    <!-- P101 旁路 -->
    <rect x="250" y="512" width="200" height="56" rx="4" stroke-dasharray="6 5"/>

    <!-- N5 -->
    <rect x="470" y="650" width="300" height="62" rx="4"/>

    <!-- D2 -->
    <path d="M620,744 L755,800 L620,856 L485,800 Z"/>

    <!-- wifi 重连 -->
    <rect x="860" y="768" width="270" height="64" rx="4"/>

    <!-- N6 ~ N10 -->
    <rect x="470" y="906" width="300" height="62" rx="4"/>
    <rect x="470" y="1000" width="300" height="62" rx="4"/>
    <rect x="440" y="1094" width="360" height="66" rx="4"/>
    <rect x="440" y="1192" width="360" height="66" rx="4"/>
    <rect x="470" y="1290" width="300" height="66" rx="4"/>

    <!-- 电压检测注释 -->
    <rect x="860" y="1192" width="300" height="56" rx="4" stroke-dasharray="6 5"/>

    <!-- 待机 -->
    <rect x="460" y="1388" width="320" height="70" rx="14" fill="#F4F4F4"/>

    <!-- D3 -->
    <path d="M620,1490 L760,1546 L620,1602 L480,1546 Z"/>

    <!-- 事件分支 -->
    <rect x="860" y="1400" width="300" height="64" rx="4"/>
    <rect x="860" y="1480" width="300" height="64" rx="4"/>
    <rect x="860" y="1560" width="300" height="64" rx="4"/>
    <rect x="860" y="1640" width="300" height="64" rx="4"/>
    <rect x="860" y="1720" width="300" height="64" rx="4"/>

    <!-- 异常说明 -->
    <rect x="60" y="1880" width="560" height="76" rx="4" stroke-dasharray="6 5"/>
  </g>

  <!-- ============ 连线层 ============ -->
  <g filter="url(#ink)" fill="none" stroke="#111111" stroke-width="1.5">
    <path d="M620,166 V206" marker-end="url(#arrow)"/>
    <path d="M620,268 V300" marker-end="url(#arrow)"/>
    <path d="M620,362 V394" marker-end="url(#arrow)"/>
    <path d="M620,452 V486" marker-end="url(#arrow)"/>

    <!-- D1 是 -->
    <path d="M620,594 V650" marker-end="url(#arrow)"/>
    <!-- D1 否 -->
    <path d="M490,540 H452" marker-end="url(#arrow)"/>
    <path d="M350,568 V628 H620"/>

    <!-- D2 是 -->
    <path d="M620,856 V906" marker-end="url(#arrow)"/>
    <!-- D2 否 -->
    <path d="M755,800 H860" marker-end="url(#arrow)"/>
    <path d="M995,832 V880 H660 V906" marker-end="url(#arrow)"/>

    <path d="M620,968 V1000" marker-end="url(#arrow)"/>
    <path d="M620,1062 V1094" marker-end="url(#arrow)"/>
    <path d="M620,1160 V1192" marker-end="url(#arrow)"/>
    <path d="M620,1258 V1290" marker-end="url(#arrow)"/>
    <path d="M620,1356 V1388" marker-end="url(#arrow)"/>
    <path d="M620,1458 V1490" marker-end="url(#arrow)"/>

    <!-- 电压注释连接 -->
    <path d="M860,1220 H804" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

    <!-- D3 分发（总线） -->
    <path d="M760,1546 H800"/>
    <path d="M800,1432 V1752"/>
    <path d="M800,1432 H860" marker-end="url(#arrow)"/>
    <path d="M800,1512 H860" marker-end="url(#arrow)"/>
    <path d="M800,1592 H860" marker-end="url(#arrow)"/>
    <path d="M800,1672 H860" marker-end="url(#arrow)"/>
    <path d="M800,1752 H860" marker-end="url(#arrow)"/>

    <!-- 回路：处理完回待机 -->
    <path d="M1160,1432 H1195"/>
    <path d="M1160,1512 H1195"/>
    <path d="M1160,1592 H1195"/>
    <path d="M1160,1672 H1195"/>
    <path d="M1160,1752 H1195"/>
    <path d="M1195,1432 V1840 H60 V1423 H456" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ 文本层 ============ -->
  <text x="620" y="149" font-size="16" text-anchor="middle">上电</text>

  <text x="620" y="232" font-size="14.5" font-weight="bold" text-anchor="middle">app_main()</text>
  <text x="620" y="254" font-size="11.5" fill="#333333" text-anchor="middle">NVS · 事件日志 · 异常表 · 配置</text>

  <text x="620" y="326" font-size="14.5" font-weight="bold" text-anchor="middle">app_display_init()</text>
  <text x="620" y="348" font-size="11.5" fill="#333333" text-anchor="middle">GPIO10 先拉低 · 防上电花屏</text>

  <text x="620" y="419" font-size="14.5" font-weight="bold" text-anchor="middle">ds3231_init()</text>
  <text x="620" y="440" font-size="11.5" fill="#333333" text-anchor="middle">I2C · GPIO8 / GPIO9</text>

  <text x="620" y="536" font-size="13.5" text-anchor="middle">DS3231 应答？</text>

  <text x="350" y="536" font-size="12.5" text-anchor="middle">app_fault_set(P101)</text>
  <text x="350" y="556" font-size="11" fill="#333333" text-anchor="middle">时间源 = SNTP only</text>

  <text x="620" y="676" font-size="14.5" font-weight="bold" text-anchor="middle">wifi_manager_start()</text>
  <text x="620" y="698" font-size="11.5" fill="#333333" text-anchor="middle">STA 直连上次成功 SSID</text>

  <text x="620" y="805" font-size="13.5" text-anchor="middle">30 s 内拿到 IP？</text>

  <text x="995" y="792" font-size="12.5" text-anchor="middle">wifi_reconnect() × 3</text>
  <text x="995" y="814" font-size="11" fill="#333333" text-anchor="middle">退避 5 s，仍失败 → P002</text>

  <text x="620" y="932" font-size="14.5" font-weight="bold" text-anchor="middle">app_time_start()</text>
  <text x="620" y="954" font-size="11.5" fill="#333333" text-anchor="middle">SNTP 校时 → 回写 DS3231</text>

  <text x="620" y="1026" font-size="13" text-anchor="middle">app_weather_start() / location_start()</text>
  <text x="620" y="1048" font-size="11.5" fill="#333333" text-anchor="middle">10 min 周期刷新</text>

  <text x="620" y="1121" font-size="13" text-anchor="middle">radar_start()　·　pkt_voice_start()</text>
  <text x="620" y="1144" font-size="11.5" fill="#333333" text-anchor="middle">UART2 256000 雷达 · UART1 9600 语音</text>

  <text x="620" y="1219" font-size="13" text-anchor="middle">key_scan_init()　·　voltage_monitor_init()</text>
  <text x="620" y="1242" font-size="11.5" fill="#333333" text-anchor="middle">GPIO8 开关 · GPIO7 ADC 电压检测</text>

  <text x="1010" y="1216" font-size="12.5" text-anchor="middle">电压 &lt; 3.4 V</text>
  <text x="1010" y="1237" font-size="11" fill="#333333" text-anchor="middle">播报 + 状态灯红（P104）</text>

  <text x="620" y="1316" font-size="14" font-weight="bold" text-anchor="middle">pkt_voice_play(BOOT_PROMPT)</text>
  <text x="620" y="1339" font-size="11.5" fill="#333333" text-anchor="middle">开机问候 + 开机动画 ≥ 8 s</text>

  <text x="620" y="1417" font-size="16" font-weight="bold" text-anchor="middle">待机 · 主界面</text>
  <text x="620" y="1440" font-size="11.5" fill="#333333" text-anchor="middle">时钟 + 天气 + 状态灯（呼吸绿）</text>

  <text x="620" y="1551" font-size="13.5" text-anchor="middle">事件类型？</text>

  <text x="1010" y="1424" font-size="12.5" font-weight="bold" text-anchor="middle">pkt_voice_result()</text>
  <text x="1010" y="1446" font-size="11" fill="#333333" text-anchor="middle">识别 ID → 命令分发（子图 A）</text>

  <text x="1010" y="1504" font-size="12.5" font-weight="bold" text-anchor="middle">key_scan_event()</text>
  <text x="1010" y="1526" font-size="11" fill="#333333" text-anchor="middle">开关翻转 → 页面 / 亮度（子图 B）</text>

  <text x="1010" y="1584" font-size="12.5" font-weight="bold" text-anchor="middle">radar_presence_event()</text>
  <text x="1010" y="1606" font-size="11" fill="#333333" text-anchor="middle">有人 60% / 无人 10 s → 20%（子图 C）</text>

  <text x="1010" y="1664" font-size="12.5" font-weight="bold" text-anchor="middle">timer_tick()</text>
  <text x="1010" y="1686" font-size="11" fill="#333333" text-anchor="middle">闹钟 / 正计时 / 倒计时（子图 D）</text>

  <text x="1010" y="1744" font-size="12.5" font-weight="bold" text-anchor="middle">net_event()</text>
  <text x="1010" y="1766" font-size="11" fill="#333333" text-anchor="middle">Wi-Fi 重连 / 天气恢复</text>

  <!-- 是 / 否 -->
  <text x="632" y="628" font-size="12">是</text>
  <text x="468" y="526" font-size="12">否</text>
  <text x="632" y="886" font-size="12">是</text>
  <text x="800" y="791" font-size="12">否</text>

  <!-- 回路文字 -->
  <text x="640" y="1830" font-size="12" fill="#333333" text-anchor="middle">处理完 → 回待机（状态机不退出）</text>

  <!-- 异常说明 -->
  <text x="340" y="1908" font-size="12.5" text-anchor="middle">异常沿用现有 P 编码框架</text>
  <text x="340" y="1928" font-size="11.5" fill="#333333" text-anchor="middle">app_fault_set(code) → NVS 持久化；L1 到点未恢复 → esp_restart()，L2 长期记录</text>
  <text x="340" y="1946" font-size="11.5" fill="#333333" text-anchor="middle">判断失败的分支只登记异常，不阻塞主流程继续启动</text>

  <text x="60" y="1996" font-size="11.5" fill="#555555">注：本图为设计蓝图，未实现功能按目标行为绘制；子流程 A/B/C/D 见后续单页。</text>
</svg>
</body>
</html>
